name: Verify Windows chat and voice across the Internet
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [internet-check]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      return_invite: ${{ steps.verify.outputs.return_invite }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build the independent Internet host
        working-directory: server
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tinyspeak"
          CGO_ENABLED=0 go build -trimpath -tags embedded_voice -o "$RUNNER_TEMP/tinyspeak/host" .
          curl -fsSL --retry 3 https://github.com/n0-computer/dumbpipe/releases/download/v0.40.2/dumbpipe-v0.40.2-linux-x86_64.tar.gz -o "$RUNNER_TEMP/link.tar.gz"
          echo "25823c4fb7d10430740a1b57111108c6950c2eb901874a7ebd894bda5894089d  $RUNNER_TEMP/link.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/link.tar.gz" -C "$RUNNER_TEMP/tinyspeak"
          install -m 755 "$(find "$RUNNER_TEMP/tinyspeak" -type f -name dumbpipe -print -quit)" "$RUNNER_TEMP/tinyspeak/TinySpeak Link.exe"
      - name: Start a disposable room on a separate network
        id: start
        run: |
          set -eu
          base="$RUNNER_TEMP/tinyspeak"
          node tests/internet-host.mjs "$base/host" "$base" --request-return >"$base/test.log" 2>&1 </dev/null &
          for attempt in {1..45}; do
            if test -s "$base/invite"; then echo "invite=$(cat "$base/invite")" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 1
          done
          tail -20 "$base/test.log"
          exit 1
      - name: Test invite ${{ steps.start.outputs.invite }}
        id: verify
        run: |
          set -eu
          base="$RUNNER_TEMP/tinyspeak"
          for attempt in {1..155}; do
            if test -s "$base/passed"; then
              echo "return_invite=$(cat "$base/return-invite")" >> "$GITHUB_OUTPUT"
              cat "$base/passed"
              exit 0
            fi
            sleep 2
          done
          tail -20 "$base/test.log"
          exit 1
  windows-peer:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-voice-probe
      - name: Read the disposable host invite from this run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $url = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $pattern = '^Test invite (TS2-[A-Za-z0-9_-]{32}\.endpoint[a-z2-7]{50,192}\.[A-Za-z0-9]{16})$'
          foreach ($attempt in 1..120) {
            $jobs = (Invoke-RestMethod $url -Headers $headers -MaximumRetryCount 2).jobs
            foreach ($job in $jobs) {
              foreach ($step in $job.steps) {
                if ($step.name -cmatch $pattern) {
                  [IO.File]::WriteAllText("$env:RUNNER_TEMP/host-invite", $Matches[1])
                  exit 0
                }
              }
            }
            Start-Sleep -Seconds 4
          }
          throw 'The Linux host did not publish its disposable invite'
      - name: Test the Linux host and host a room for the second Windows runner
        shell: pwsh
        run: |
          $app = "$env:RUNNER_TEMP/ts/TinySpeak"
          $room = (New-Item -Type Directory "$env:RUNNER_TEMP/test-room").FullName
          $files = (Join-Path $env:GITHUB_WORKSPACE 'tests/internet-host.mjs'), "$app/TinySpeak Host.exe", $room
          $arguments = ($files | ForEach-Object { '"' + $_ + '"' }) -join ' '
          $server = Start-Process -FilePath (Get-Command node).Source -ArgumentList $arguments -WindowStyle Hidden -PassThru -RedirectStandardOutput "$room/out.log" -RedirectStandardError "$room/err.log"
          try {
            foreach ($attempt in 1..45) {
              if (Test-Path "$room/invite") { break }
              if ($server.HasExited) { throw 'Windows test host stopped' }
              Start-Sleep -Seconds 1
            }
            if (!(Test-Path "$room/invite")) { throw 'Windows test host did not advertise' }
            node tests/internet-client.mjs $app "$app/probe.exe" "$env:RUNNER_TEMP/host-invite" "$room/invite"
            if ($LASTEXITCODE) { throw 'The first Windows guests failed' }
            if (!$server.WaitForExit(360000) -or $server.ExitCode -ne 0 -or !(Test-Path "$room/passed")) {
              throw 'The second Windows runner did not verify this host'
            }
          } finally {
            if (!$server.HasExited) { $server.Kill($true) }
            Get-Content "$room/out.log", "$room/err.log" -Tail 20
          }
  windows-guests:
    needs: host
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-voice-probe
      - name: Connect two guests to the other Windows runner
        env:
          TEST_INVITE: ${{ needs.host.outputs.return_invite }}
        shell: pwsh
        run: |
          $app = "$env:RUNNER_TEMP/ts/TinySpeak"
          if ($env:TEST_INVITE -cnotmatch '^TS2-[A-Za-z0-9_-]{32}\.endpoint[a-z2-7]{50,192}\.[A-Za-z0-9]{16}$') { throw 'Missing the disposable Internet invite' }
          $file = "$env:RUNNER_TEMP/return-invite"
          [IO.File]::WriteAllText($file,$env:TEST_INVITE)
          node tests/internet-client.mjs $app "$app/probe.exe" $file
          if ($LASTEXITCODE) { throw 'The Windows guests did not receive both audio streams' }
